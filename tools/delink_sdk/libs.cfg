# Library split config (M2 lib data step): one section per library = one swappable unit.  ownership.py reads it and writes
# output/delink_sdk/ownership.csv (owner per address range) + interface_<lib>.txt; the link scripts take the member sets from here.
# Keys: members = files of "<obj name> <lib>:<member>" lines (rw_overlay_prep.py format); exclude = member keys (fnmatch) never linked
# (duplicate variants); names = csv files "addr,name,..." of functions matched from source (libmatch.py); variant = default implementation.
# variant = source (lua, qhull; zlib later): objects built from upstream source replace the exe's code range of the library; sdk / libcmt: lib members.
# Order = link order (game objects first, then the libs in this order).

[rw]
variant = sdk
members = output/rw_overlay_members.txt
# variant duplicates of identical code: the exe uses rtpng, rppatch (plain), rpskin (pipesshared)
# nosplit: members whose static data is referenced by address from recomp C objects (g_freelistcreate_62e9bc, g_rp_62ec70, g_rt_948080: no external symbol to link against)
nosplit = rwcore.lib:*bamemory.obj rpworld.lib:*bageomet.obj rt2d.lib:*d3d9r/gstate.obj
exclude = rtpngcw.lib:* rppatchmatfx.lib:*patchd3d9matfx.obj rpskinmatfx.lib:*skind3d9matfxshared.obj

[crt]
variant = libcmt
members = output/crt_overlay_members.txt

[lua]
variant = source
names = names/MFL_lua40.csv
# variant = source: the whole library comes from upstream source (output/libmatch2/build_libs.sh), the exe's code range is dropped (plan_srclib.py)
region = 004c7150-004d08d0
ns = output/libmatch2/lua40_ns.csv
idnames = tools/delink_sdk/idnames_lua.csv

[qhull]
variant = source
names = names/MFL_qhull2003.csv
region = 0058d1c0-005b5f93
idnames = tools/delink_sdk/idnames_qhull.csv
# the game replaced qhull's fprintf by its own function (selector int instead of FILE*, FUN_0058cc40, game code that stays); the qh struct (COMMON qh_qh) stays at its exe address: game code outside the lib reads its fields
alias = fprintf=0058cc40 qh_qh=00949480
ns = output/libmatch2/qf02.csv
